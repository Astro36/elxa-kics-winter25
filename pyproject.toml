[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "elxa-kics-winter25"
version = "0.1.0"
requires-python = ">=3.8, <3.9"
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.8",
]
dependencies = [
    "einops",
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "torch",
    "tqdm",
]

[project.urls]
Issues = "https://github.com/Astro36/elxa-kics-winter25/issues"
Source = "https://github.com/Astro36/elxa-kics-winter25"

[tool.setuptools]
packages = ["data_provider", "exp", "models", "utils"]

[tool.ruff]
include = ["pyproject.toml", "data_provider/*.py", "exp/*.py", "models/*.py", "utils/*.py"]
line-length = 200
required-version = ">=0.8.0"

[tool.ruff.lint]
extend-select = [
    "B",    # flake8-bugbear
    "BLE",  # blind-except
    "C4",   # flake8-comprehensions
    "COM",  # flake8-commas
    "E",    # pycodestyle(Error)
    "FURB", # refurb
    "I",    # isort
    "ICN",  # flake8-import-conventions
    "NPY",  # NumPy-specific rules
    "PERF", # Perflint
    "PGH",  # pygrep
    "PIE",  # flake8-pie
    "PL",   # Pylint
    "PTH",  # flake8-use-pathlib
    "Q",    # flake8-quotes
    "RUF",  # Ruff-specific rules
    "S",    # flake8-bandit
    "SIM",  # flake8-simplify
    "TC",   # flake8-type-checking
    "TID",  # flake8-tidy-imports
    "UP",   # pyupgrade
    "W",    # pycodestyle(Warning)
    "YTT",  # flake8-2020
]
ignore = [
    "B904",    # use 'raise ... from err'
    "E501",    # Line too long
    "E741",    # Ambiguous variable name
    "PLR0913", # Too many arguments in function definition
    "PLR2004", # Magic value used in comparison, consider replacing `n` with a constant variable
]
